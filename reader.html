<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atlas Reader · 渲染 Markdown 文档，支持目录、代码块、Mermaid 图、引用"
    />
    <title>Atlas · Reader</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body class="reader-body">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="返回首页">
        <span class="brand-mark">A</span>
        <span class="brand-name">Atlas <span>· Reader</span></span>
      </a>
      <nav class="nav-list" aria-label="阅读导航">
        <a href="./index.html#resume">简历</a>
        <a href="./index.html#review">复习</a>
        <a href="./index.html#code">代码</a>
        <a href="./index.html#interview">面试</a>
      </nav>
      <div class="topbar-actions">
        <a class="cmdk-trigger" href="./index.html">
          <span>← 返回首页</span>
        </a>
      </div>
    </header>

    <main class="reader-shell">
      <aside class="article-rail" aria-label="资料列表">
        <p class="rail-label">Library</p>
        <div id="articleRail"></div>
      </aside>

      <article class="article-frame">
        <header class="article-header" id="articleHero">
          <div class="article-header-skeleton"></div>
        </header>
        <div class="article-layout">
          <div class="markdown-body" id="articleBody">
            <p>Loading...</p>
          </div>
          <nav class="toc" id="toc" aria-label="文章目录">
            <p>On this page</p>
            <div id="tocList"></div>
          </nav>
        </div>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script type="module" src="./reader.js"></script>
  </body>
</html>
